plugins {
    id "dev.architectury.loom" version "1.10-SNAPSHOT"
    id "maven-publish"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

loom {
    silentMojangMappingsLicense()
    forge {
        mixinConfig "deterministic_chance.mixins.json"
    }
    mods {
        deterministic_chance {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            property "forge.enabledGameTestNamespaces", "deterministic_chance"
            runDir "run-client"
        }
        server {
            server()
            property "forge.enabledGameTestNamespaces", "deterministic_chance"
            runDir "run-server"
        }
        gameTestServer {
            environment "gameTestServer"
            forgeTemplate "gameTestServer"
            property "forge.enabledGameTestNamespaces", "deterministic_chance"
            property "deterministicchance.expectedTestMods",
                    providers.gradleProperty("expected_test_mods").getOrElse("")
            property "deterministicchance.forbiddenTestMods",
                    providers.gradleProperty("forbidden_test_mods").getOrElse("")
            runDir "run-gametest"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
    }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.covers1624.net" }
    maven { url = "https://maven.firstdark.dev/snapshots" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "GTCEu"
        url = "https://maven.gtceu.com"
        content {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    maven {
        url = "https://dvs1.progwml6.com/files/maven/"
        content {
            includeGroup "mezz.jei"
        }
    }
}

configurations {
    productiveBeesBundle
}

def productiveLibOutput = layout.projectDirectory.file(
        ".gradle/productive-bees-libs/productivelib-1.20.1-0.0.4.jar").asFile

dependencies {
    minecraft "net.minecraft:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${forge_version}"

    // Every integration is compile-only. Runtime fixtures are opt-in so the
    // same jar can be verified both with and without each supported mod.
    modCompileOnly "curse.maven:mekanism-268560:${mekanism_file_id}"
    if (property("runtime_mekanism").toBoolean()) {
        modRuntimeOnly "curse.maven:mekanism-268560:${mekanism_file_id}"
    }

    modCompileOnly "appeng:appliedenergistics2-forge:${ae2_version}"
    modCompileOnly "org.appliedenergistics:guideme:${guideme_version}"
    if (property("runtime_ae2").toBoolean()) {
        modRuntimeOnly "appeng:appliedenergistics2-forge:${ae2_version}"
        modRuntimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    }

    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    if (property("runtime_jei").toBoolean()) {
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    }

    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    // The slim Create artifact references these API types from its public
    // classes, so they are needed to compile the optional machine hooks too.
    modCompileOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}") {
        transitive = false
    }
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"
    modCompileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    if (property("runtime_create").toBoolean()) {
        modRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
            transitive = false
        }
        modRuntimeOnly "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
        modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
        modRuntimeOnly "dev.engine-room.vanillin:vanillin-forge-${minecraft_version}:${vanillin_version}"
        modRuntimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
        // The slim Create development artifact omits its jar-in-jar copy.
        modRuntimeOnly "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"
        forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    }

    modCompileOnly "com.teamcofh:cofh_core:${cofh_core_version}"
    modCompileOnly "com.teamcofh:thermal_core:${thermal_core_version}"
    modCompileOnly("com.teamcofh:thermal_foundation:${thermal_foundation_version}") {
        transitive = false
    }
    modCompileOnly "com.teamcofh:thermal_expansion:${thermal_expansion_version}"
    if (property("runtime_thermal").toBoolean()) {
        modRuntimeOnly "com.teamcofh:cofh_core:${cofh_core_version}"
        modRuntimeOnly "com.teamcofh:thermal_core:${thermal_core_version}"
        modRuntimeOnly("com.teamcofh:thermal_foundation:${thermal_foundation_version}") {
            transitive = false
        }
        modRuntimeOnly "com.teamcofh:thermal_expansion:${thermal_expansion_version}"
    }

    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
        transitive = false
    }
    modCompileOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") {
        transitive = false
    }
    if (property("runtime_gtceu").toBoolean()) {
        modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}") {
            transitive = false
        }
        // GTCEu declares these as embedded dependencies, but the development
        // artifact used by Loom does not expose its jar-in-jar payload.
        modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") {
            transitive = false
        }
        modRuntimeOnly "curse.maven:configuration-444699:${configuration_file_id}"
        // GTCEu/LDLib ship these inside production jars. Loom's development
        // artifacts do not unpack those nested jars for the GameTest runtime.
        modRuntimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
        modRuntimeOnly "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"
        forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    }

    modCompileOnly("curse.maven:immersive-engineering-231951:${immersive_engineering_file_id}") {
        transitive = false
    }
    if (property("runtime_immersive_engineering").toBoolean()) {
        modRuntimeOnly("curse.maven:immersive-engineering-231951:${immersive_engineering_file_id}") {
            transitive = false
        }
    }

    productiveBeesBundle("maven.modrinth:productivebees:${productive_bees_version}") {
        transitive = false
    }
    // Productive Bees embeds ProductiveLib in its production jar. Forge
    // expands it in normal installations, while Loom's flat development
    // classpath does not, so expose the exact embedded jar to compile/tests.
    if (!productiveLibOutput.exists()) {
        productiveLibOutput.parentFile.mkdirs()
        def bundle = new java.util.zip.ZipFile(configurations.productiveBeesBundle.singleFile)
        try {
            def entry = bundle.getEntry("META-INF/jarjar/productivelib-1.20.1-0.0.4.jar")
            if (entry == null) {
                throw new GradleException("Productive Bees no longer embeds ProductiveLib 1.20.1-0.0.4")
            }
            productiveLibOutput.withOutputStream { output ->
                bundle.getInputStream(entry).withCloseable { input -> output << input }
            }
        } finally {
            bundle.close()
        }
    }
    def productiveLibClasspath = files(productiveLibOutput)
    modCompileOnly("maven.modrinth:productivebees:${productive_bees_version}") {
        transitive = false
    }
    modCompileOnly productiveLibClasspath
    if (property("runtime_productive_bees").toBoolean()) {
        modRuntimeOnly("maven.modrinth:productivebees:${productive_bees_version}") {
            transitive = false
        }
        modRuntimeOnly productiveLibClasspath
    }

    modCompileOnly("curse.maven:integrated-dynamics-236307:${integrated_dynamics_file_id}") {
        transitive = false
    }
    modCompileOnly("curse.maven:cyclops-core-232758:${cyclops_core_file_id}") {
        transitive = false
    }
    modCompileOnly("curse.maven:common-capabilities-247007:${common_capabilities_file_id}") {
        transitive = false
    }
    if (property("runtime_integrated_dynamics").toBoolean()) {
        modRuntimeOnly("curse.maven:integrated-dynamics-236307:${integrated_dynamics_file_id}") {
            transitive = false
        }
        modRuntimeOnly("curse.maven:cyclops-core-232758:${cyclops_core_file_id}") {
            transitive = false
        }
        modRuntimeOnly("curse.maven:common-capabilities-247007:${common_capabilities_file_id}") {
            transitive = false
        }
    }

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

processResources {
    dependsOn "generateGameTestTemplate"
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/resources/gameTest"))

tasks.register("generateGameTestTemplate") {
    def outputFile = layout.buildDirectory.file(
            "generated/resources/gameTest/data/deterministic_chance/structures/empty.nbt")
    outputs.file(outputFile)
    doLast {
        def encoded = ""
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.bytes = Base64.decoder.decode(encoded)
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("sourcesJar").configure {
    dependsOn "generateGameTestTemplate"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def gameTestLog = layout.projectDirectory.file("run-gametest/logs/latest.log")

tasks.named("runGameTestServer").configure {
    doFirst {
        project.delete(gameTestLog)
    }
}

tasks.register("verifyGameTests") {
    group = "verification"
    description = "Runs Forge GameTests and fails if the server exits before reporting success."
    dependsOn "runGameTestServer"
    doLast {
        File logFile = gameTestLog.asFile
        if (!logFile.isFile()) {
            throw new GradleException("GameTest server did not create ${logFile}")
        }
        String log = logFile.getText("UTF-8")
        if (!(log =~ /All \d+ required tests passed/).find()) {
            throw new GradleException(
                    "GameTest server did not report a complete successful run; inspect ${logFile}")
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
